# bindings/packages/alltt.yaml
# =============================================================================
# CTAN Package: alltt (Johannes Braams, LaTeX3 Project)
# Model: lib/LaTeXML/Package/alltt.sty.ltxml / base LaTeX tools
#
# Semi-verbatim environment where \ and { } remain functional.
# =============================================================================

identity:
  package: alltt
  tier: ctan_package
  source_reference: "lib/LaTeXML/Package/alltt.sty.ltxml"
  description: "Semi-verbatim environment where backslash and braces retain their normal meanings"

reading:
  lexical_mode:
    # Retains \ as CatCode 0 (ESCAPE) and { } as CatCodes 1, 2 (BEGIN/END GROUP)
    # Character categories are supplied by the selected mouth profile.

    tex_mechanics:
      obey_lines: true
      active_space: true
      first_paragraph_suppressed: true

    source_capture:
      preserve_raw_slice: true
      preserve_indentation: true

  environments:
    - name: alltt
      family: block_semi_verbatim
      profile: semi_verbatim_block
      arity: 0
      terminator:
        exact_string: "\\end{alltt}"
        # In alltt.dtx, \ and {} retain CatCodes 0, 1, 2.
        # The closing boundary is recognized as command \end with argument {alltt}.
        # Trailing text on the same physical line is preserved as ordinary document content.
        regex_pattern: "\\\\end[ \\t]*\\{alltt\\}"
        boundary_mode: "command_boundary"
        trailing_line_behavior: "preserve_trailing_content"
      span_classification:
        category: "semi_verbatim_block"
        semantic_role: "formatted_code_listing"
