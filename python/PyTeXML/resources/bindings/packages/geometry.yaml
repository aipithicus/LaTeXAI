reading:
  load_effects:
    status: unresolved
    source_reference: 'lib-ctan/geometry/provenance.json, TeX Live r78315; geometry.sty:31-32, 750-814, 986-1124'
    optional_inputs: [geometry.cfg]
    detail: >-
      Geometry loads optional geometry.cfg before class/package key processing,
      computes layout, and registers begin-document work. Configuration contents,
      key-value expansion and load-time effects require a fuller reading contract;
      this binding does not establish preservation of caller booleans or options.
