# resources/bindings/packages/fancyvrb.yaml
# =============================================================================
# CTAN Package: fancyvrb (Timothy Van Zandt, Denis Girou, Sebastian Rahtz)
# Model: lib/LaTeXML/Package/fancyvrb.sty.ltxml / lib-ctan/fancyvrb/tex/latex/fancyvrb/fancyvrb.sty
#
# Advanced customizable verbatim environments with options and definition factories.
# Note: Options such as commandchars, commentchar, and codes mutate reading rules!
# =============================================================================

identity:
  package: fancyvrb
  version: "4.7"
  tier: ctan_package
  requires_engine: engine/verbatim
  source_reference: "lib-ctan/fancyvrb/tex/latex/fancyvrb/fancyvrb.sty"
  description: "Sophisticated verbatim facilities with key-value options, reading-affecting parameters, and environment factories"

reading:
  # ---------------------------------------------------------------------------
  # Option Resolution: Reading-Affecting Configuration Parameters
  # (lib-ctan/fancyvrb/tex/latex/fancyvrb/fancyvrb.sty:131)
  # ---------------------------------------------------------------------------
  option_resolution:
    default_profile: raw_block
    reading_affecting_keys:
      commandchars:
        effect: "assign_command_and_group_delimiters"
        syntax: "\\char1\\char2\\char3" # e.g. commandchars=\\\{\}
        profile_override: "semi_verbatim_block"
      commentchar:
        effect: "enable_verbatim_comment"
        syntax: "\\char"               # e.g. commentchar=\%
      codes:
        effect: "dynamic_catcode_mutations"
        unsupported_action: "report_unresolved"
      codes*:
        effect: "dynamic_catcode_mutations"
        unsupported_action: "report_unresolved"
    # Retained for later formatting; all other keys need a binding decision.
    non_reading_options: [numbers, frame, fontfamily, fontsize, fontshape, fontseries, showspaces]
    unsupported_options_behavior: "report_unresolved"

  # ---------------------------------------------------------------------------
  # Environments
  # ---------------------------------------------------------------------------
  environments:
    - name: Verbatim
      family: block_verbatim
      grammar: {handler: physical_line_literal, arity: 0}
      has_optional_arguments: true
      options_syntax: "key_val"         # \begin{Verbatim}[numbers=left,commandchars=\\\{\}]
      terminator:
        exact_string: "\\end{Verbatim}"
        matching_domain: "physical_line"
        regex_pattern: "\\\\end[ \\t]*\\{Verbatim\\}"
        trailing_line_behavior: "discard_with_warning"
      span_classification:
        category: "configurable_literal"
        default_category: "opaque_literal"
        semantic_role: "code_listing"

    - name: BVerbatim
      family: block_verbatim
      grammar: {handler: physical_line_literal, arity: 0}
      has_optional_arguments: true
      options_syntax: "key_val"         # Boxed verbatim (aligned horizontally)
      terminator:
        exact_string: "\\end{BVerbatim}"
        matching_domain: "physical_line"
        regex_pattern: "\\\\end[ \\t]*\\{BVerbatim\\}"
        trailing_line_behavior: "discard_with_warning"
      span_classification:
        category: "configurable_literal"
        default_category: "opaque_literal"
        semantic_role: "code_listing"

    - name: LVerbatim
      family: block_verbatim
      grammar: {handler: physical_line_literal, arity: 0}
      has_optional_arguments: true
      options_syntax: "key_val"         # Line-mode verbatim
      terminator:
        exact_string: "\\end{LVerbatim}"
        matching_domain: "physical_line"
        regex_pattern: "\\\\end[ \\t]*\\{LVerbatim\\}"
        trailing_line_behavior: "discard_with_warning"
      span_classification:
        category: "configurable_literal"
        default_category: "opaque_literal"
        semantic_role: "code_listing"

  # ---------------------------------------------------------------------------
  # Commands
  # ---------------------------------------------------------------------------
  commands:
    - name: "\\Verb"
      family: inline_verbatim
      profile: inline_delimited
      has_optional_arguments: true
      options_syntax: "key_val"         # \Verb[fontfamily=courier]|...|
      delimiter_mode: "dynamic_char"
      span_classification:
        category: "opaque_inline_literal"
        semantic_role: "code_inline"

    - name: "\\VerbatimInput"
      family: source_command
      action: external_literal
      grammar:
        handler: source_arguments
        arguments:
          - {name: options, kind: optional}
          - {name: target, kind: braced}
      metadata:
        semantic_role: external_verbatim
        inline_environment: Verbatim

  # ---------------------------------------------------------------------------
  # Definition Factories
  # ---------------------------------------------------------------------------
  factories:
    - command: "\\DefineVerbatimEnvironment"
      family: environment_factory
      action: define_environment
      grammar:
        handler: source_arguments
        arguments:
          - {name: name, kind: braced}
          - {name: base, kind: braced}
          - {name: options, kind: braced}
      metadata:
        name_argument: name
        base_argument: base
        options_argument: options
        base_binding: packages/fancyvrb
        variants:
          - {suffix: '', options: {}}
          - {suffix: '*', options: {showspaces: true}}
        terminator:
          exact_string: '\end{{{name}}}'
          regex_pattern: '\\end[ \t]*\{{{name}\}}'
      description: "Creates \\begin{new_env_name}...\\end{new_env_name} using base_env_name reading rules and bound options"

    - command: "\\CustomVerbatimCommand"
      syntax: "{new_cs_name}{base_cs_name}{options}"
      registers: command
      inherit_from_arg: 2
      span_classification:
        category: "opaque_inline_literal"
      description: "Creates \\new_cs_name using base_cs_name reading rules"

    - command: "\\RecustomVerbatimEnvironment"
      syntax: "{env_name}{base_env_name}{options}"
      registers: environment_override
      inherit_from_arg: 2
