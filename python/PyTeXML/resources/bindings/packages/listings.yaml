# resources/bindings/packages/listings.yaml
# =============================================================================
# CTAN Package: listings (Carsten Heinz, Brooks Moses, Jobst Hoffmann)
# Model: lib/LaTeXML/Package/listings.sty.ltxml / lib-ctan/listings/tex/latex/listings/listings.sty
#
# Source code listings with language formatting, key-val options, and escapes.
# Operational contract for reading: escapeinside, escapechar, and mathescape
# reconfigure the reader to interpolate TeX tokens within the listing.
# =============================================================================

identity:
  package: listings
  version: "1.11b"
  tier: ctan_package
  source_reference: "lib-ctan/listings/tex/latex/listings/listings.sty"
  description: "Typesetting source code environments with syntax highlighting and escape delimiters"

reading:
  # listings.sty:294-319 defines named styles globally; lstset:402-404
  # applies keyval assignments in the caller's scope. Names are normalized by
  # lst@NormedDef. Style bodies are stored and applied only when selected.
  configuration:
    namespace: packages/listings
    style_key: style
    name_normalization: lowercase_no_spaces
    definition_scope: global
    assignment_scope: local
    exclusive_keys: [[escapeinside, escapechar]] # Both replace lst@DefEsc.
    bare_defaults: {mathescape: true}
  # ---------------------------------------------------------------------------
  # Option Resolution: Reading-Affecting Configuration Parameters
  # ---------------------------------------------------------------------------
  option_resolution:
    default_profile: raw_block
    reading_affecting_keys:
      escapeinside:
        effect: "define_interpolation_delimiters"
        syntax: "{open_delim}{close_delim}"   # e.g. escapeinside={(*@}{@*)}
        profile_override: "interpolated_verbatim_block"
      escapechar:
        effect: "define_single_escape_char"
        syntax: "char"                        # e.g. escapechar=`
        profile_override: "interpolated_verbatim_block"
      mathescape:
        effect: "toggle_math_mode_on_dollar"
        syntax: "boolean"                     # mathescape=true
        profile_override: "interpolated_verbatim_block"
    unsupported_options_behavior: "report_unresolved"
    # These affect presentation; values remain stored tokens, never executed.
    # Language selection here does not claim language-driver interpretation.
    non_reading_options:
      - language
      - caption
      - label
      - numbers
      - frame
      - backgroundcolor
      - commentstyle
      - keywordstyle
      - numberstyle
      - stringstyle
      - basicstyle
      - breakatwhitespace
      - breaklines
      - captionpos
      - keepspaces
      - numbersep
      - showspaces
      - showstringspaces
      - showtabs
      - tabsize

  # ---------------------------------------------------------------------------
  # Environments
  # ---------------------------------------------------------------------------
  environments:
    - name: lstlisting
      family: block_verbatim
      grammar: {handler: physical_line_literal, arity: 0}
      has_optional_arguments: true
      options_syntax: "key_val"               # \begin{lstlisting}[language=Python,escapeinside={(*@}{@*)}]
      terminator:
        exact_string: "\\end{lstlisting}"
        matching_domain: "physical_line"
        regex_pattern: "\\\\end[ \\t]*\\{lstlisting\\}"
        trailing_line_behavior: "discard_with_warning"
      span_classification:
        category: "configurable_literal"
        default_category: "opaque_literal"
        semantic_role: "code_listing"

  # ---------------------------------------------------------------------------
  # Commands
  # ---------------------------------------------------------------------------
  commands:
    - name: "\\lstinline"
      family: inline_verbatim
      profile: inline_delimited
      # listings.sty 1941-1995: raw character entry closes at the first
      # active delimiter, including the first } for the braced spelling.
      grammar:
        handler: inline_character
        delimiter_skip_characters: [" "]
        delimiter_catcode: 13
      multiline_allowed: false
      invalid_delimiters: [" ", "\t", "\r", "\n"]
      has_optional_arguments: true
      options_syntax: "key_val"               # \lstinline[language=C]|int x = 0;| or \lstinline{foo}
      delimiter_mode: "hybrid_delim_or_braced" # Supports both |...| and {...}
      span_classification:
        category: "opaque_inline_literal"
        semantic_role: "code_inline"

    - name: "\\lstinputlisting"
      family: source_command
      action: external_literal
      grammar:
        handler: source_arguments
        arguments:
          - {name: options, kind: optional}
          - {name: target, kind: braced}
      metadata:
        semantic_role: external_verbatim
        inline_environment: lstlisting

    - name: "\\lstset"
      family: configuration_command
      action: apply_configuration
      grammar:
        handler: source_arguments
        arguments: [{name: options, kind: braced}]
      metadata:
        header_catcodes: {"@": 11, "=": 12}
        unsupported_arguments: []

    - name: "\\lstdefinestyle"
      family: configuration_command
      action: define_configuration
      grammar:
        handler: source_arguments
        arguments:
          - {name: dialect, kind: optional}
          - {name: name, kind: braced}
          - {name: parent_dialect, kind: optional}
          - {name: options, kind: braced}
          - {name: aspects, kind: optional}
      metadata:
        header_catcodes: {"@": 11, "=": 12}
        unsupported_arguments: [dialect, parent_dialect, aspects]
