# resources/bindings/engine/verbatim.yaml
# =============================================================================
# Authoritative specification for LaTeX Kernel Verbatim constructs.
# Built into LaTeX 2e base (latex.ltx / ltmiscen.dtx).
# Active in all LaTeX documents without requiring \usepackage{verbatim}.
# =============================================================================

identity:
  name: verbatim
  tier: engine_kernel
  source_reference: "base/ltmiscen.dtx"
  description: "Authoritative specification for core LaTeX kernel verbatim environments and commands"

reading:
  # ---------------------------------------------------------------------------
  # 1. Lexical Mode: Category code and reader state overrides
  # ---------------------------------------------------------------------------
  lexical_mode:
    # All TeX specials shift to CatCode 12 (OTHER). No macro expansion or grouping occurs.
    # Character categories are supplied by the selected mouth profile.

    # TeX lexical mechanics vs. source capture policy
    tex_mechanics:
      trailing_spaces_stripped_by_input_ln: true # TeX input_ln strips trailing spaces before tokenization
      active_endlinechar_obeylines: true         # Newlines become active ^^M executing \par or line break
      active_space_obeyspaces: true              # Space character produces explicit space tokens
      first_paragraph_suppressed: true           # Later paragraph handling; never remove the source newline here

    # Source capture contract for preparation stage
    source_capture:
      preserve_raw_slice: true                   # Retain authored source slice between delimiters verbatim
      preserve_indentation: true

  # ---------------------------------------------------------------------------
  # 2. Environments: Block verbatim
  # ---------------------------------------------------------------------------
  environments:
    - name: verbatim
      family: block_verbatim
      profile: raw_block
      arity: 0                                   # Takes NO arguments. Immediate '[' is literal text
      grammar:
        handler: token_delimited
        terminator_baseline: latex_ascii
      starred_variant: false
      visible_spaces: false
      terminator:
        exact_string: "\\end{verbatim}"
        regex_pattern: "\\\\end\\{verbatim\\}"   # Kernel does NOT allow whitespace like \end {verbatim}
        matching_domain: mouth_tokens
        boundary_mode: token_sequence
        trailing_line_behavior: "preserve_trailing_content" # Kernel does NOT discard remainder of the line
      span_classification:
        category: "opaque_literal"
        semantic_role: "code_listing"

    - name: verbatim*
      family: block_verbatim
      profile: raw_block
      arity: 0
      grammar:
        handler: token_delimited
        terminator_baseline: latex_ascii
      starred_variant: true
      visible_spaces: true                       # Spaces are rendered with visible space glyph (U+2423 ␣)
      terminator:
        exact_string: "\\end{verbatim*}"
        regex_pattern: "\\\\end\\{verbatim\\*\\}"
        matching_domain: mouth_tokens
        boundary_mode: token_sequence
        trailing_line_behavior: "preserve_trailing_content"
      span_classification:
        category: "opaque_literal"
        semantic_role: "code_listing"

  # ---------------------------------------------------------------------------
  # 3. Commands: Inline verbatim
  # ---------------------------------------------------------------------------
  commands:
    - name: "\\verb"
      family: inline_verbatim
      profile: inline_delimited
      grammar:
        handler: inline_character
        control_sequence: "verb"
        star_token_allowed: true                 # Reader sees \verb then separate * token
        star_token: "*"
        starred_command: "\\verb*"
        delimiter_skip_characters: [" "]         # Kernel @sverb since 2020/10/01
        delimiter_catcode: 13                    # Closing delimiter executes the local group exit
      starred_variant: false
      visible_spaces: false
      delimiter_mode: "dynamic_char"
      invalid_delimiters: [" ", "\t", "\r", "\n"] # Whitespace not handled as a delimiter by this profile
      multiline_allowed: false                   # \verb cannot span across lines; raises error if EOL hit
      span_classification:
        category: "opaque_inline_literal"
        semantic_role: "code_inline"

    - name: "\\verb*"
      family: inline_verbatim
      profile: inline_delimited
      grammar:
        handler: inline_character
        delimiter_skip_characters: [" "]
        delimiter_catcode: 13
      starred_variant: true
      visible_spaces: true
      delimiter_mode: "dynamic_char"
      invalid_delimiters: [" ", "\t", "\r", "\n"]
      multiline_allowed: false
      span_classification:
        category: "opaque_inline_literal"
        semantic_role: "code_inline"
