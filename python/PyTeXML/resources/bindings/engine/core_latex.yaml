# resources/bindings/engine/core_latex.yaml
# =============================================================================
# Core LaTeX 2e / TeX primitives and format constructs.
# Built into LaTeX 2e base (latex.ltx / l3bootstrap.dtx / TeX82).
# Active in all LaTeX documents by default.
# =============================================================================

identity:
  name: core_latex
  tier: engine_kernel
  source_reference: "base/latex.ltx / l3kernel/l3bootstrap.dtx"
  description: "Core primitives, catcode mutators, reader parameters, and structural boundaries"

reading:
  commands:
    - name: "\\begin"
      family: environment_open
      grammar:
        handler: environment_name
        argument: braced_literal_name

  # ---------------------------------------------------------------------------
  # Lexical and Catcode Mutators
  # ---------------------------------------------------------------------------
  catcode_mutators:
    - name: "\\makeatletter"
      action: "assign_catcode"
      target_char: "@"
      category: 11  # CatCode.LETTER
      scope: local
      affects_reading: true

    - name: "\\makeatother"
      action: "assign_catcode"
      target_char: "@"
      category: 12  # CatCode.OTHER
      scope: local
      affects_reading: true

    - name: "\\catcode"
      action: "assign_catcode_dynamic"
      syntax: "char_number '='? category_number"
      scope: local
      affects_reading: true

    # Expl3 Syntax Switching (l3kernel/l3bootstrap.dtx)
    # Combines catcode overrides with reader-parameter effects (endlinechar).
    # Note: '@' is intentionally NOT modified by \ExplSyntaxOn; it retains whatever
    # category it held previously (e.g. 11 under \makeatletter or 12 under \makeatother).
    - name: "\\ExplSyntaxOn"
      action: "expl3_lexical_enter"
      overrides:
        "_": 11     # CatCode.LETTER
        ":": 11     # CatCode.LETTER
        "~": 10     # CatCode.SPACE
        " ": 9      # CatCode.IGNORED
        "\t": 9     # CatCode.IGNORED
        "\"": 12    # CatCode.OTHER
        "|": 12     # CatCode.OTHER
        "^": 7      # CatCode.SUPERSCRIPT
      reader_parameters:
        endlinechar: 32  # When endlinechar=32 and ' ' is IGNORED (9), newlines inject no spaces
      state_management:
        guard_variable: "\\l__kernel_expl_bool"
        repeated_call_behavior: "reapply_preserve_snapshot"
        saved_parameters:
          catcodes: ["\t", " ", "\"", ":", "^", "_", "|", "~"]
          reader_parameters: ["endlinechar"]
      scope: local
      affects_reading: true

    - name: "\\ExplSyntaxOff"
      action: "expl3_lexical_exit"
      state_management:
        restores_parameters:
          catcodes: ["\t", " ", "\"", ":", "^", "_", "|", "~"]
          reader_parameters: ["endlinechar"]
        exit_behavior: "reset_guard_and_noop" # Restores saved snapshot, clears guard, becomes no-op
      scope: local
      affects_reading: true

  # ---------------------------------------------------------------------------
  # Scoping and Grouping Primitives
  # ---------------------------------------------------------------------------
  grouping:
    - name: "\\begingroup"
      action: "push_lexical_scope"
      trigger: control_sequence
      state_management: {group_kind: semi_simple}
    - name: "\\endgroup"
      action: "pop_lexical_scope"
      trigger: control_sequence
      state_management: {group_kind: semi_simple}
    - name: "group_begin"
      action: "push_lexical_scope"
      trigger: token_category
      catcode: 1    # CatCode.BEGIN_GROUP (matches '{' or any char with catcode 1)
      state_management: {group_kind: simple}
    - name: "group_end"
      action: "pop_lexical_scope"
      trigger: token_category
      catcode: 2    # CatCode.END_GROUP (matches '}' or any char with catcode 2)
      state_management: {group_kind: simple}

  # ---------------------------------------------------------------------------
  # Static Conditionals
  # ---------------------------------------------------------------------------
  conditionals:
    - name: "\\iftrue"
      evaluation: always_true
    - name: "\\iffalse"
      evaluation: always_false
    - name: "\\newif"
      syntax: "\\if{name}"
      registers: boolean_switch
    - name: "\\else"
      action: "conditional_alternative"
    - name: "\\fi"
      action: "conditional_terminator"

  # ---------------------------------------------------------------------------
  # Structural File Inclusions
  # ---------------------------------------------------------------------------
  inclusions:
    - name: "\\input"
      syntax: "file_path"
      behavior: "pure_token_splice"
      requires_clearpage: false
      extensions: [".tex", ""]

    - name: "\\include"
      syntax: "file_path"
      behavior: "chapter_splice"
      requires_clearpage: true
      extensions: [".tex", ""]

    - name: "\\subfile"
      syntax: "file_path"
      behavior: "strip_child_preamble"
      extensions: [".tex", ""]
