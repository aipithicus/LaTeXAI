# resources/bindings/engine/core_latex.yaml
# =============================================================================
# Temporary LaTeX format and package-facing reader knowledge.
# Built into LaTeX 2e base (latex.ltx / l3bootstrap.dtx / TeX82).
# Active in all LaTeX documents by default.
# =============================================================================

identity:
  name: core_latex
  tier: engine_kernel
  source_reference: "TeX82 tex.web (get_r_token / scan_toks / conditional / pass_text) / base/latex.ltx / l3kernel/l3bootstrap.dtx"
  description: "Unmigrated format constructs and source argument contracts"

reading:
  commands:
    - name: '\flushbottom'
      family: source_command
      action: declared_effects
      grammar: {handler: source_arguments, arguments: []}
      metadata:
        source_reference: 'latex2e base/ltpage.dtx v1.0o: flushbottom'
        requires_unshadowed: [relax]
        meaning_copies: {'@textbottom': relax, '@texttop': relax}
        effect_summary:
          complete: true
          scope: local
          writes:
            meanings: {names: ['@textbottom', '@texttop']}
    - name: '\sloppy'
      family: source_command
      action: declared_effects
      grammar: {handler: source_arguments, arguments: []}
      metadata:
        source_reference: 'latex2e base/ltpage.dtx v1.0o: sloppy assigns tolerance, emergencystretch, hfuzz, vfuzz'
        requires_unshadowed: [tolerance, emergencystretch, hfuzz, vfuzz, 'p@']
        meaning_copies: {}
        effect_summary:
          complete: true
          scope: local
          writes:
            registers: [tolerance, emergencystretch, hfuzz, vfuzz]
    # Capture-only boundaries (base/ltdefns.dtx, base/ltmiscen.dtx).
    # Preparation neither checks target existence nor installs replacements,
    # evaluates their bodies, or schedules/runs hook code.
    - name: "\\renewenvironment"
      family: source_command
      action: opaque
      grammar:
        handler: source_arguments
        arguments:
          - {name: star, kind: star}
          - {name: name, kind: braced, role: data}
          - {name: count, kind: optional, role: data}
          - {name: default, kind: optional, role: stored}
          - {name: begin, kind: braced, role: stored}
          - {name: end, kind: braced, role: stored}
    - name: "\\AtBeginDocument"
      family: source_command
      action: opaque
      grammar:
        handler: source_arguments
        arguments: [{name: body, kind: braced, role: stored}]
    - name: "\\AtEndDocument"
      family: source_command
      action: opaque
      grammar:
        handler: source_arguments
        arguments: [{name: body, kind: braced, role: stored}]
    # latex2e base/ltclass.dtx v1.5o, @ifl@aded; no binding-availability test.
    # https://github.com/latex3/latex2e/blob/develop/base/ltclass.dtx
    - name: "\\@ifpackageloaded"
      family: source_command
      action: branch_test
      metadata: {predicate: loaded, kind: package}
      grammar:
        handler: source_arguments
        arguments: [{name: name, kind: braced, role: data}, {name: then, kind: braced, role: branch}, {name: else, kind: braced, role: branch}]
    - name: "\\@ifclassloaded"
      family: source_command
      action: branch_test
      metadata: {predicate: loaded, kind: class}
      grammar:
        handler: source_arguments
        arguments: [{name: name, kind: braced, role: data}, {name: then, kind: braced, role: branch}, {name: else, kind: braced, role: branch}]
    # latex2e base/lterror.dtx v1.2u: message/help tokens are expanded for
    # diagnostics, not dispatched as document commands. Expansion remains later.
    # https://github.com/latex3/latex2e/blob/develop/base/lterror.dtx
    - name: "\\PackageError"
      family: source_command
      action: opaque
      grammar:
        handler: source_arguments
        arguments: [{name: package, kind: braced, role: diagnostic}, {name: message, kind: braced, role: diagnostic}, {name: help, kind: braced, role: diagnostic}]
    - name: "\\ClassError"
      family: source_command
      action: opaque
      grammar:
        handler: source_arguments
        arguments: [{name: class, kind: braced, role: diagnostic}, {name: message, kind: braced, role: diagnostic}, {name: help, kind: braced, role: diagnostic}]
    # latex2e base/ltdefns.dtx: capture the authored signature and replacement
    # tokens; do not synthesize the kernel's optional-argument helper macros.

    # latex2e base/ltclass.dtx: captured option code runs at processing time.
    # The dispatcher executes only bounded reading effects from stored tokens.
    - name: "\\DeclareOption"
      family: option_control
      action: declare_option
      grammar:
        handler: source_arguments
        arguments: [{name: name, kind: braced, role: data, literal_categories: [4, 7, 8, 10, 11, 12]}, {name: body, kind: braced, role: stored}]
        starred_arguments: [{name: body, kind: braced, role: stored}]
    - name: "\\ProcessOptions"
      family: option_control
      action: process_options
      metadata: {order: declaration, starred_order: request}
      grammar: {handler: source_arguments, arguments: [], starred_arguments: []}
    - name: "\\ExecuteOptions"
      family: option_control
      action: execute_options
      grammar: {handler: source_arguments, arguments: [{name: options, kind: braced, role: data, literal_categories: [4, 7, 8, 10, 11, 12]}]}

    # TeX82 scan_toks/get_r_token: scope and replacement expansion are independent.
    # The definition operation publishes only after successful body collection.
    - name: "\\begin"
      family: environment_open
      grammar:
        handler: environment_name
        argument: braced_literal_name

    # latex2e base/ltdefns.dtx (newif/@if): local aliases and setter macros.
    # The factory is not itself a nesting conditional. Only literal targets
    # with the conventional prefix are supported; source stays unexpanded.
    - name: "\\newif"
      family: conditional_factory
      scope: local
      grammar:
        handler: boolean_declaration
        target_prefix: if
        initial: "\\iffalse"
        setters: {"true": "\\iftrue", "false": "\\iffalse"}

  # ---------------------------------------------------------------------------
  # Lexical and Catcode Mutators
  # ---------------------------------------------------------------------------
  catcode_mutators:
    - name: "\\makeatletter"
      action: "assign_catcode"
      target_char: "@"
      category: 11  # CatCode.LETTER
      scope: local
      affects_reading: true

    - name: "\\makeatother"
      action: "assign_catcode"
      target_char: "@"
      category: 12  # CatCode.OTHER
      scope: local
      affects_reading: true

    - name: "\\ExplSyntaxOn"
      action: "expl3_lexical_enter"
      overrides:
        "_": 11     # CatCode.LETTER
        ":": 11     # CatCode.LETTER
        "~": 10     # CatCode.SPACE
        " ": 9      # CatCode.IGNORED
        "\t": 9     # CatCode.IGNORED
        "\"": 12    # CatCode.OTHER
        "|": 12     # CatCode.OTHER
        "^": 7      # CatCode.SUPERSCRIPT
      reader_parameters:
        endlinechar: 32  # When endlinechar=32 and ' ' is IGNORED (9), newlines inject no spaces
      state_management:
        guard_variable: "\\l__kernel_expl_bool"
        repeated_call_behavior: "reapply_preserve_snapshot"
        saved_parameters:
          catcodes: ["\t", " ", "\"", ":", "^", "_", "|", "~"]
          reader_parameters: ["endlinechar"]
      scope: local
      affects_reading: true

    - name: "\\ExplSyntaxOff"
      action: "expl3_lexical_exit"
      state_management:
        restores_parameters:
          catcodes: ["\t", " ", "\"", ":", "^", "_", "|", "~"]
          reader_parameters: ["endlinechar"]
        exit_behavior: "reset_guard_and_noop" # Restores saved snapshot, clears guard, becomes no-op
      scope: local
      affects_reading: true

  # ---------------------------------------------------------------------------
  # Scoping and Grouping Primitives
  # ---------------------------------------------------------------------------
  conditionals:
    - {name: "\\if@twoside", role: opener, evaluation: deferred, capture_operands: 0}
  inclusions:
    - name: "\\input"
      family: source_command
      action: source_input
      grammar: {handler: source_arguments, arguments: [{name: target, kind: filename}]}
      syntax: "file_path"
      behavior: "pure_token_splice"
      requires_clearpage: false
      extensions: [".tex", ""]

    - name: "\\include"
      family: source_command
      action: source_include
      grammar: {handler: source_arguments, arguments: [{name: target, kind: braced}]}
      syntax: "file_path"
      behavior: "chapter_splice"
      requires_clearpage: true
      extensions: [".tex", ""]

    - name: "\\subfile"
      syntax: "file_path"
      behavior: "strip_child_preamble"
      extensions: [".tex", ""]
