# resources/profiles/mouth/inline_delimited.yaml
# =============================================================================
# Next-Character Delimited Inline Verbatim Profile (\verb|...|, \verb+...+)
# =============================================================================

identity:
  name: inline_delimited
  category: inline_literal
  description: "Inline literal where the following non-space character becomes the closing delimiter"

family: inline
delimiter_mode: next_char
has_star_variant: true
escape_char: null
multiline_allowed: false

lexical_mode:
  character_classes:
    - {id: specials, kind: catcode_run, domain: mouth_characters, pattern: '[\\{}$&#^_~%]+', catcode: 12}
    - {id: whitespace, kind: catcode_run, domain: mouth_characters, pattern: '[ \t\r]+', catcode: 13}
  source_capture:
    preserve_raw_slice: true

span_classification:
  category: opaque_inline_literal
  semantic_role: code_inline
