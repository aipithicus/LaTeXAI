# resources/policies/prepare.yaml
# =============================================================================
# Preparation Policy (bounded roles, mouth emission and provenance)
#
# Maps semantic roles (from bindings/AST) and lexical event classifications
# to pipeline actions for compiling a clean, compact, canonical master.tex.
# =============================================================================

identity:
  name: prepare
  target: "extracted/master.tex"
  description: "Primary extraction policy: eliminates authorial draft markup and dead branches, canonicalizes whitespace"

# -----------------------------------------------------------------------------
# 1. Action per Semantic Role (classified by bindings and syntax)
# -----------------------------------------------------------------------------
role_actions:
  author_notes: eliminate             # \begin{comment} and \excludecomment blocks
  editorial_annotation: eliminate     # \todo, \note, \annotation (identified by binding role)
  dead_conditional: eliminate         # Inactive \iftrue / \iffalse branches
  code_listing: preserve              # verbatim, lstlisting; lexical category remains separate
  code_inline: preserve               # \verb, \lstinline (inline code preserved immutable)
  formatted_code_listing: preserve    # alltt; preparation preserves ordinary macro calls
  transparent_container: unwrap       # \includecomment blocks (delimiters stripped, content kept)
  wrapped_container: preserve         # Boundary hooks remain for the execution dispatcher
  formatting_container: preserve      # \textbf, \emph, etc. (styling preserved in master.tex)
  external_verbatim: inline           # \verbatiminput transcluded as immutable literal

# -----------------------------------------------------------------------------
# 2. Action per Lexical Event (emitted by tex_reader.py)
# -----------------------------------------------------------------------------
lexical_events:
  comment_line: eliminate             # Discard lines containing only comments and whitespace
  comment_inline: strip_payload       # Strip comment text while preserving necessary token boundary
  line_continuation: preserve         # Preserve suppression of endline tokens; '%' spelling may be removed
  magic_directive: extract_metadata   # Extract % !TeX directives to manifest, omit from source

# -----------------------------------------------------------------------------
# 3. Structural Normalization
# -----------------------------------------------------------------------------
structural_normalization:
  paragraph_breaks: preserve          # Serialize every paragraph token; do not assume repeated \par is redundant
  trailing_whitespace: strip          # Discard input_ln tails and ignored spaces only in admitted reader events

# -----------------------------------------------------------------------------
# 4. Provenance
# -----------------------------------------------------------------------------
provenance:
  emit_ledger: true
  rle_compression: true

# Diagnostics are enabled; repairs require an explicit mode and allow-list.
linting:
  mode: report
  repairs: []
