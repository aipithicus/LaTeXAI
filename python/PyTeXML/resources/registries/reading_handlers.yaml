identity:
  registry: reading_handlers
  description: Reading actions and their current implementation boundary
handlers:
  collected_environment_definition:
    status: scanner
    description: Capture a named environment's signature, processing body and final code without execution
  balanced_environment_tokens:
    status: scanner
    description: Collect unexpanded tokens using group-aware begin/end nesting; no literal or conditional dispatch
  capture_setting:
    status: context_effect
    description: Store scoped declaration defaults as frozen tokens or a literal control-sequence name
  command_definition:
    status: scanner
    description: Capture local starred or unstarred command declarations with a literal
      target, argument count and optional default; dispatch owns scoped registration
  pass_options:
    status: scanner
    description: Capture literal options for a future package/class load without activating it
  declare_option:
    status: scanner
    description: Capture named or default option bodies without executing their tokens
  process_options:
    status: scanner
    description: Select declared options in configured order and dispatch bounded reading effects
  execute_options:
    status: scanner
    description: Dispatch declared default options in explicit list order without consuming later requests
  reading_noop:
    status: context_effect
    description: Established no-op command retained without changing reading state
  define_environment:
    status: scanner
    description: Register a scoped environment using a declared base, options and terminator recipe
  physical_line_literal:
    status: scanner
    description: Match configured literal terminators against physical lines while preserving raw source
  external_literal:
    status: scanner
    description: Capture a literal file reference for cached transclusion or retained payload emission
  bounded_conditional:
    status: scanner
    description: StructuralDispatcher evaluates constant and established boolean predicates and routes delimiters;
      a mouth-based scanner skips inactive branches
  boolean_declaration:
    status: scanner
    description: Capture a literal boolean target; the dispatcher installs scoped conditional and setter meanings
  primitive_definition:
    status: scanner
    description: Capture local unexpanded primitive definitions; global and expanding
      forms remain boundaries
  environment_name:
    status: scanner
    description: Read a literal braced environment name without expansion
  inline_character:
    status: scanner
    description: Read an inline literal with a locally active character delimiter
  token_delimited:
    status: scanner
    description: Match an exact block terminator by character token identity
  assign_catcode:
    status: context_effect
    description: StructuralDispatcher routes resolved local character assignments
      to ReaderContext
  assign_catcode_dynamic:
    status: scanner
    description: Route bounded literal assignments; computed values and general numeric scanning remain deferred
  literal_catcode_assignment:
    status: scanner
    description: Scan decimal or backtick character codes and decimal categories terminated by space, relax or EOF
  expl3_lexical_enter:
    status: context_effect
    description: Route resolved local expl3 entry and preserve its first snapshot
  expl3_lexical_exit:
    status: context_effect
    description: Route local expl3 exit and restore the saved state
  push_lexical_scope:
    status: context_effect
    description: Open a declared source group and snapshot local lexical state
  pop_lexical_scope:
    status: context_effect
    description: Close a matching source group and restore local lexical state
  pure_token_splice:
    status: deferred
    description: Input behavior implemented by source_input and the preparation source owner
  chapter_splice:
    status: deferred
    description: Include behavior implemented by source_include with explicit page boundaries
  strip_child_preamble:
    status: deferred
    description: Requires subfile context and reading-aware file inclusion
  source_arguments:
    status: scanner
    description: Scan declarative ordered braced, optional, star and filename arguments without expansion
  document_class:
    status: scanner
    description: Emit a class declaration request for the source owner
  package_load:
    status: scanner
    description: Emit an ordered package activation request
  metadata:
    status: scanner
    description: Capture reading-neutral declaration metadata
  end_input:
    status: scanner
    description: Finish the current physical line before returning from an input
  environment_end:
    status: scanner
    description: Close the matching environment group in the structural dispatcher
  bibliography:
    status: scanner
    description: Request an inline classic bibliography at its source site
  bibliography_style:
    status: scanner
    description: Capture publisher-style metadata for canonical bibliography preparation
  biblatex_resource:
    status: scanner
    description: Recognize a deferred rich bibliography resource
  biblatex_print:
    status: scanner
    description: Recognize a deferred rich bibliography emission site
  citation:
    status: scanner
    description: Capture supported literal citation keys
  include_selection:
    status: scanner
    description: Capture the literal include selection
  opaque:
    status: scanner
    description: Retain a command whose arguments require a reading-neutral proof
  source_input:
    status: scanner
    description: Request a source input occurrence
  source_include:
    status: scanner
    description: Request an include occurrence with page boundaries
  source_import:
    status: scanner
    description: Request an input under an explicit document-relative import directory
  source_subimport:
    status: scanner
    description: Request an input relative to the active import directory
  asset_reference:
    status: scanner
    description: Capture a literal image dependency and its argument span
  asset_search_paths:
    status: scanner
    description: Capture scoped literal graphics search directories
  asset_extensions:
    status: scanner
    description: Capture scoped graphics extension declarations
