# resources/experimental/policies/prose_extraction.yaml
# =============================================================================
# NLP & Semantic Search Policy: Prose Extraction
#
# Optimized for text mining, document embedding, RAG ingestion, and semantic
# indexing. Unwraps styling macros to produce clean prose, eliminates author notes,
# and converts code blocks to markdown formatting.
# =============================================================================

identity:
  name: prose_extraction
  target: "prose_stream"
  description: "Prose extraction: unwraps typographic and styling containers, eliminates editorial blocks, and converts code to markdown"

# -----------------------------------------------------------------------------
# 1. Action per Semantic Role (classified by bindings and syntax)
# -----------------------------------------------------------------------------
role_actions:
  author_notes: eliminate             # Strip comment blocks completely
  editorial_annotation: eliminate     # Strip \todo, \note annotations
  dead_conditional: eliminate         # Prune inactive branches
  code_listing: convert_to_markdown   # Format verbatim listings as markdown code fences
  code_inline: convert_to_markdown    # Format inline code as backticks
  formatted_code_listing: convert_to_markdown # Format semi-verbatim listings as code fences
  transparent_container: unwrap       # Unwrap container delimiters
  wrapped_container: preserve         # Do not discard unexecuted boundary hooks
  formatting_container: unwrap        # Unwrap \textbf, \emph, \textcolor to raw prose
  external_verbatim: convert_to_markdown

# -----------------------------------------------------------------------------
# 2. Action per Lexical Event (emitted by tex_reader.py)
# -----------------------------------------------------------------------------
lexical_events:
  comment_line: eliminate             # Discard all comment lines
  comment_inline: strip_payload       # Strip inline comments from text
  line_continuation: eliminate        # Join lines cleanly across continuation marks
  magic_directive: eliminate          # Discard editor/compiler directives

# -----------------------------------------------------------------------------
# 3. Structural Normalization
# -----------------------------------------------------------------------------
structural_normalization:
  paragraph_breaks: coalesce          # Normalize paragraph boundaries
  trailing_whitespace: strip

# -----------------------------------------------------------------------------
# 4. Provenance
# -----------------------------------------------------------------------------
provenance:
  emit_ledger: true
  rle_compression: true
