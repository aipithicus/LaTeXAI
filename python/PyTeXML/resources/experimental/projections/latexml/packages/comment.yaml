identity:
  package: comment
  corresponds_to_binding: "packages/comment"
  tier: ctan_package
  target_format: "ltx_xml"
  description: "Projection rules for comment environments"

projections:
  environments:
    comment:
      xml_element: null  # Produces zero IR elements by default
      semantic_role: "author_notes"
