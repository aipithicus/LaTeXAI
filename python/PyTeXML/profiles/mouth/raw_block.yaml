# profiles/mouth/raw_block.yaml
# =============================================================================
# Standard Opaque Block Verbatim Profile (\begin{verbatim} ... \end{verbatim})
# =============================================================================

identity:
  name: raw_block
  category: block_literal
  description: "Fully opaque block verbatim; all TeX specials demoted to OTHER, whitespace active"

family: block
terminator_pattern: "\\end{{{name}}}"
comment_char: null
escape_char: null
preserve_whitespace: true
allow_nesting: false
multiline_allowed: true

lexical_mode:
  character_classes:
    - {id: specials, kind: catcode_run, domain: mouth_characters, pattern: '[\\{}$&#^_~%]+', catcode: 12}
    - {id: whitespace, kind: catcode_run, domain: mouth_characters, pattern: '[ \t\r]+', catcode: 13}
  tex_mechanics:
    trailing_spaces_stripped_by_input_ln: true
    active_endlinechar_obeylines: true
    active_space_obeyspaces: true
    first_paragraph_suppressed: true
  source_capture:
    preserve_raw_slice: true
    preserve_indentation: true

span_classification:
  category: opaque_literal
  semantic_role: code_listing
