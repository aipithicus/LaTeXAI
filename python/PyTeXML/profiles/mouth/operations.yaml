# profiles/mouth/operations.yaml
# =============================================================================
# Python Handler Dispatch Registry for Native TeX Operations
#
# Corresponds to declarative specifications in bindings/engine/core_latex.yaml.
# Maps operations directly to Python runtime handlers in the extractor engine.
# =============================================================================

identity:
  registry: native_operations
  corresponds_to_binding: "engine/core_latex"
  description: "Runtime dispatcher mappings for core catcode mutators, scoping, and I/O"

operations:
  # --- Catcode Mutations ---
  - name: "\\makeatletter"
    action: "assign_catcode"
    handler: "core.catcode.makeatletter"
    scope: local
    affects_reading: true

  - name: "\\makeatother"
    action: "assign_catcode"
    handler: "core.catcode.makeatother"
    scope: local
    affects_reading: true

  - name: "\\catcode"
    action: "assign_catcode_dynamic"
    handler: "core.catcode.assign"
    syntax: "char_ref '='? int"
    scope: local
    affects_reading: true

  - name: "\\ExplSyntaxOn"
    action: "expl3_lexical_enter"
    handler: "core.catcode.expl3_on"
    scope: local
    affects_reading: true
    affects_reader_parameters: ["endlinechar"]

  - name: "\\ExplSyntaxOff"
    action: "expl3_lexical_exit"
    handler: "core.catcode.expl3_off"
    scope: local
    affects_reading: true
    restores_reader_parameters: ["endlinechar"]

  # --- Grouping / Scoping ---
  - name: "\\begingroup"
    action: "push_lexical_scope"
    handler: "core.scope.push_group"
    trigger: control_sequence

  - name: "\\endgroup"
    action: "pop_lexical_scope"
    handler: "core.scope.pop_group"
    trigger: control_sequence

  - name: "group_begin"
    action: "push_lexical_scope"
    handler: "core.scope.push_group"
    trigger: token_category
    catcode: 1  # CatCode.BEGIN_GROUP

  - name: "group_end"
    action: "pop_lexical_scope"
    handler: "core.scope.pop_group"
    trigger: token_category
    catcode: 2  # CatCode.END_GROUP

  # --- Inclusions (Resolved during Preprocessing) ---
  - name: "\\input"
    action: "pure_token_splice"
    handler: "core.io.input_file"
    syntax: "file_path"

  - name: "\\include"
    action: "chapter_splice"
    handler: "core.io.include_file"
    syntax: "file_path"
