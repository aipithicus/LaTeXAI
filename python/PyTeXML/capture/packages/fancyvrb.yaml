# capture/packages/fancyvrb.yaml
# =============================================================================
# Downstream Projection & Capture: fancyvrb.sty
#
# Corresponds to: bindings/packages/fancyvrb.yaml
# =============================================================================

identity:
  package: fancyvrb
  corresponds_to_binding: "packages/fancyvrb"
  tier: ctan_package
  target_format: "ltx_xml"
  description: "Projection rules for fancyvrb verbatim environments and commands"

projections:
  environments:
    Verbatim:
      xml_element: "ltx:verbatim"
      attributes:
        font: "typewriter"
      semantic_role: "code_listing"

    BVerbatim:
      xml_element: "ltx:verbatim"
      attributes:
        font: "typewriter"
        class: "boxed"
      semantic_role: "code_listing"

    LVerbatim:
      xml_element: "ltx:verbatim"
      attributes:
        font: "typewriter"
      semantic_role: "code_listing"

  commands:
    "\\Verb":
      xml_element: "ltx:verbatim"
      attributes:
        font: "typewriter"
      semantic_role: "code_inline"

    "\\VerbatimInput":
      xml_element: "ltx:verbatim"
      attributes:
        font: "typewriter"
      semantic_role: "code_listing"
