# bindings/packages/comment.yaml
# =============================================================================
# CTAN Package: comment (Victor Eijkhout)
# Model: lib/LaTeXML/Package/comment.sty.ltxml / CTAN macros/latex/contrib/comment/comment.sty
#
# Dedicated selective exclusion/inclusion engine for environments.
# Comprehension layer only: defines the syntactic boundaries of comment blocks.
# Strict termination: \end{comment} must occur at the beginning of the line (column 0).
# =============================================================================

identity:
  package: comment
  version: "3.8"
  tier: ctan_package
  source_reference: "lib/LaTeXML/Package/comment.sty.ltxml"
  description: "Selectively includes or excludes entire sections of text and environments"

reading:
  environments:
    - name: comment
      family: delimited_raw_block
      profile: discard_block
      lexical_mode:
        catcode_overrides:
          " ": 12
          "\r": 12
        reader_parameters:
          endlinechar: 13
      terminator:
        exact_string: "\\end{comment}"
        # In comment.sty, \end{comment} MUST occupy the entire physical line at column 0.
        # Indented '  \end{comment}' or trailing content like '\end{comment}%...' or '\end{comment}TEXT'
        # causes string comparison to fail; the line is treated as continuing comment text!
        matching_domain: "physical_line"
        regex_pattern: "^\\\\end\\{comment\\}$"
        requires_column_zero: true
        trailing_content_allowed: false
      span_classification:
        category: "editorial_comment_block"
        semantic_role: "author_notes"

  # Dynamic definition factories that create custom included/excluded environments
  factories:
    - command: "\\excludecomment"
      syntax: "{env_name}"
      registers: environment
      family: delimited_raw_block
      profile: discard_block
      span_classification:
        category: "editorial_comment_block"
        semantic_role: "author_notes"
      description: "Registers \\begin{env_name}...\\end{env_name} as an editorial comment block with column 0 termination"

    - command: "\\includecomment"
      syntax: "{env_name}"
      registers: environment
      family: unwrap_block
      span_classification:
        category: "transparent_block"
        semantic_role: "transparent_container"
      description: "Registers \\begin{env_name}...\\end{env_name} as transparent content"

    - command: "\\specialcomment"
      syntax: "{env_name}{before_code}{after_code}"
      registers: environment
      family: wrapped_block
      span_classification:
        category: "wrapped_block"
        semantic_role: "wrapped_container"
      description: "Registers environment with boundary code hooks"
