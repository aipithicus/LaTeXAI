# bindings/packages/fancyvrb.yaml
# =============================================================================
# CTAN Package: fancyvrb (Timothy Van Zandt, Denis Girou, Sebastian Rahtz)
# Model: lib/LaTeXML/Package/fancyvrb.sty.ltxml / lib-ctan/fancyvrb/fancyvrb.sty
#
# Advanced customizable verbatim environments with options and definition factories.
# =============================================================================

identity:
  package: fancyvrb
  version: "4.5"
  tier: ctan_package
  requires_engine: verbatim_core
  source_reference: "lib-ctan/fancyvrb/fancyvrb.sty"
  description: "Sophisticated verbatim facilities with key-value options and environment factories"

reading:
  environments:
    - name: Verbatim
      family: block_verbatim
      has_optional_arguments: true
      options_syntax: "key_val"         # \begin{Verbatim}[numbers=left,frame=single]
      terminator:
        exact_string: "\\end{Verbatim}"
        regex_pattern: "\\\\end\\s*\\{Verbatim\\}"
      span_classification:
        category: "opaque_literal"
        semantic_role: "code_listing"

    - name: BVerbatim
      family: block_verbatim
      has_optional_arguments: true
      options_syntax: "key_val"         # Boxed verbatim (aligned horizontally)
      terminator:
        exact_string: "\\end{BVerbatim}"
        regex_pattern: "\\\\end\\s*\\{BVerbatim\\}"
      span_classification:
        category: "opaque_literal"
        semantic_role: "code_listing"

    - name: LVerbatim
      family: block_verbatim
      has_optional_arguments: true
      options_syntax: "key_val"         # Line-mode verbatim
      terminator:
        exact_string: "\\end{LVerbatim}"
        regex_pattern: "\\\\end\\s*\\{LVerbatim\\}"
      span_classification:
        category: "opaque_literal"
        semantic_role: "code_listing"

  commands:
    - name: "\\Verb"
      family: inline_verbatim
      has_optional_arguments: true
      options_syntax: "key_val"         # \Verb[fontfamily=courier]|...|
      delimiter_mode: "dynamic_char"
      span_classification:
        category: "opaque_inline_literal"
        semantic_role: "code_inline"

    - name: "\\VerbatimInput"
      family: external_verbatim_file
      has_optional_arguments: true
      options_syntax: "key_val"
      syntax: "{file_path}"
      span_classification:
        category: "external_verbatim_resource"
        semantic_role: "code_listing"

  # Definition factories: author commands that mint brand-new verbatim environments
  factories:
    - command: "\\DefineVerbatimEnvironment"
      syntax: "{new_env_name}{base_env_name}{options}"
      registers: environment
      inherit_from_arg: 2              # Inherits the profile of {base_env_name} (e.g. 'Verbatim')
      span_classification:
        category: "opaque_literal"
      description: "Creates \\begin{new_env_name}...\\end{new_env_name} using base_env_name reading rules"

    - command: "\\CustomVerbatimCommand"
      syntax: "{new_cs_name}{base_cs_name}{options}"
      registers: command
      inherit_from_arg: 2
      span_classification:
        category: "opaque_inline_literal"
      description: "Creates \\new_cs_name using base_cs_name reading rules"

    - command: "\\RecustomVerbatimEnvironment"
      syntax: "{env_name}{base_env_name}{options}"
      registers: environment_override
      inherit_from_arg: 2

